[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "sh -c 'streamlit run app.py --server.port=$PORT --server.address=0.0.0.0 --server.headless=true --browser.gatherUsageStats=false --server.enableCORS=false --server.enableXsrfProtection=false'"
healthcheckPath = "/_stcore/health"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
